<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" role="img"><defs><linearGradient id="ab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient><clipPath id="ac"><rect width="900" height="364" rx="28"/></clipPath><radialGradient id="ag0"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.32"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient><radialGradient id="ag1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#ac)"><rect width="900" height="364" fill="#04060c"/><circle cx="60" cy="330" r="260" fill="url(#ag0)"><animateTransform attributeName="transform" type="translate" values="0 0;34 -16;0 0" dur="10s" repeatCount="indefinite"/></circle><circle cx="820" cy="40" r="230" fill="url(#ag1)"><animateTransform attributeName="transform" type="translate" values="0 0;-34 20;0 0" dur="13s" repeatCount="indefinite"/></circle><text x="60" y="58"  font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="7" fill="#7c8cff" fill-opacity=".8">ABOUT</text><text x="60" y="112" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">Turning raw data into decisions through</text><text x="60" y="152" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">analysis, visualization and storytelling</text><text x="60" y="200" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8b98a9">Data analyst: I turn messy, real-world datasets into clear answers — from SQL</text><text x="60" y="227" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8b98a9">exploration and statistical analysis to interactive dashboards and business-</text><text x="60" y="254" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8b98a9">ready reports. I care about clean data, meaningful metrics, and communicating</text><text x="60" y="281" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8b98a9">insights people can act on, backed by Python and modern BI tools.</text><text x="60" y="322" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#14b8a6"><tspan>&gt; analytics · dashboards · statistics · storytelling</tspan><tspan>_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text></g><rect x=".5" y=".5" width="899" height="363" rx="28" fill="none" stroke="url(#ab)"/></svg>